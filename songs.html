        /* =========================
           GENERAL
        ========================= */

        body {

            text-align: center;

            padding: 30px;
        }


        /* =========================
           TITLE
        ========================= */

        h1 {
            color: #ff6b6b;

            margin-bottom: 30px;
        }


        /* =========================
           SONG SELECT BOX
        ========================= */

        .song-box {

            background-color: white;

            width: 500px;

            max-width: 90%;

            margin: 20px auto;

            padding: 30px;

            border-radius: 20px;

            box-shadow: 0 5px 15px #ccc;
        }


        select {

            width: 90%;

            padding: 14px;

            border: 2px solid #ff8a65;

            border-radius: 10px;

            font-size: 17px;

            margin-bottom: 20px;
        }


        /* =========================
           SONG INFORMATION
        ========================= */

        .song {

            background-color: #fff;

            width: 500px;

            max-width: 90%;

            margin: 30px auto;

            padding: 25px;

            border-radius: 20px;

            box-shadow: 0 5px 15px #ccc;
        }


        .song h2 {

            color: #ff8a65;

            margin-bottom: 15px;
        }


        /* =========================
           BUTTONS
        ========================= */

        button {

            background-color: #ff6b6b;

            color: white;

            border: none;

            padding: 12px 18px;

            margin: 5px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: bold;
        }


        button:hover {

            transform: scale(1.05);
        }


        /* =========================
           LYRICS
        ========================= */

        #lyrics {

            display: none;

            background-color: white;

            max-width: 600px;

            margin: 20px auto;

            padding: 25px;

            border-radius: 20px;

            box-shadow: 0 5px 15px #ccc;

            text-align: left;

            line-height: 1.8;
        }


        #lyrics h3 {

            color: #ff8a65;

            text-align: center;
        }


        /* =========================
           HOME BUTTON
        ========================= */

        .home-button {

            margin-top: 20px;
        }

    </style>

</head>

           SELECT SONG
        ========================= */

            const index =
                songSelect.value;


            if (index === "") {

                document.getElementById(
                    "songContainer"
                ).innerHTML = "";

                document.getElementById(
                    "lyrics"
                ).style.display = "none";

                return;
            }

            ).innerHTML = `

                    <h2>
                        🎵 ${song.title}
                    </h2>

                    <p>
                        English & Telugu Song
                    </p>

                    <br>

                    <button
                        onclick="showLyrics(${index})">

                        📖 View Lyrics

                    </button>


                    <button
                        onclick="openYouTube(${index})">

                        ▶️ YouTube

                    </button>

                </div>

            `;


            document.getElementById(
                "lyrics"
            ).style.display = "none";

        }


        /* =========================
           SHOW LYRICS
        ========================= */

        function showLyrics(index) {

            const song =
                songs[index];


            const lyrics =
                document.getElementById("lyrics");


            lyrics.style.display = "block";


            lyrics.innerHTML = `

                <h3>
                    🎵 ${song.title}
                </h3>


                <h3>
                    🇬🇧 English
                </h3>

                <p>
                    ${song.english.replace(/\n/g, "<br>")}
                </p>


                <br>


                <h3>
                    🇮🇳 Telugu
                </h3>

                <p>
                    ${song.telugu.replace(/\n/g, "<br>")}
                </p>

            `;

        }


        /* =========================
           OPEN YOUTUBE
        ========================= */

        function openYouTube(index) {

            const song =
                songs[index];


            window.open(
                song.youtube,
                "_blank"
            );

        }


        /* =========================
           GO HOME
        ========================= */

        function goHome() {

            window.location.href =
                "index.html";

        }

    </script>

</body>

</html>
